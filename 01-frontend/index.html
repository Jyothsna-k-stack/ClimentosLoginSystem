<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Climentos | Login</title>



    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

   <!-- Main Login Container -->

<div class="login-container">

    <!-- LEFT SIDE: BRANDING -->

    <div class="branding-section">

        <!-- Logo -->

        <div class="brand-logo">

            <span class="logo-icon">C</span>

            <span>Climentos</span>

        </div>


        <!-- Heading -->

        <div class="branding-content">

            <h1>Build. Innovate. Grow.</h1>

            <p>
                Empowering businesses with
                innovative technology solutions.
            </p>

        </div>


        <!-- Technology Image -->

        <div class="branding-image">

            <img
                src="images/image1.webp"
                alt="Climentos Technology Illustration">

        </div>


        <!-- Footer -->

        <div class="branding-footer">

            Secure &amp; Reliable Technology

        </div>

    </div>


    <!-- RIGHT SIDE: LOGIN -->

    <div class="login-section">

        <div class="login-card">

            <h2>Welcome Back!</h2>

            <p class="login-subtitle">
                Login to your Climentos account
            </p>


            <!--  LOGIN FORM  -->

            <form id="loginForm">

                <div class="mb-3">

                    <label class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword">

                            Show

                        </button>

                    </div>

                </div>


                <div class="forgot-password">

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-button">

                    Login

                </button>

            </form>


            <div class="signup-link">

                Don't have an account? 
                <a href="signup.html">
                    Create New Account
                </a>

            </div>

        </div>

    </div>

</div>
<!-- JavaScript -->
<script src="js/login.js"></script>
</body>

</html>
