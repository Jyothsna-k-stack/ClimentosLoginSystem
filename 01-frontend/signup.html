<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Climentos | Create New Account</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="signup-page">

    <!-- Header -->
    <header class="signup-header">

        <h1>Climentos</h1>

        <p>Build. Innovate. Grow.</p>

    </header>


    <!-- Signup Container -->
    <div class="signup-container">

        <!-- Signup Heading -->
        <div class="signup-heading">

            <h2>Create a new account</h2>

            <p>It's quick and easy.</p>

        </div>


        <!-- Signup Form -->
        <form id="signupForm">


            <!-- First Name and Last Name -->
            <div class="name-row">

                <input
                    type="text"
                    id="firstName"
                    placeholder="First name"
                    required>

                <input
                    type="text"
                    id="lastName"
                    placeholder="Last name"
                    required>

            </div>


            <!-- Email -->
            <div class="signup-field">

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Email address"
                    required>

            </div>


            <!-- Date of Birth -->
            <div class="signup-field">

                <label for="dob">
                    Date of birth
                </label>

                <input
                    type="date"
                    id="dob"
                    required>

            </div>


            <!-- Gender -->
            <div class="signup-field">

                <label>
                    Gender
                </label>

                <div class="gender-row">

                    <label class="gender-option">

                        Female

                        <input
                            type="radio"
                            name="gender"
                            value="Female"
                            required>

                    </label>


                    <label class="gender-option">

                        Male

                        <input
                            type="radio"
                            name="gender"
                            value="Male">

                    </label>


                    <label class="gender-option">

                        Custom

                        <input
                            type="radio"
                            name="gender"
                            value="Custom">

                    </label>

                </div>

            </div>


            <!-- Password -->
            <div class="signup-field">

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="New password"
                    minlength="8"
                    required>

            </div>


            <!-- Confirm Password -->
            <div class="signup-field">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required>

            </div>


            <!-- Terms -->
            <div class="signup-terms">

                <label>

                    <input
                        type="checkbox"
                        id="terms"
                        required>

                    I agree to the Terms & Conditions.

                </label>

            </div>


            <!-- Message -->
            <p id="signupMessage"
               aria-live="polite">
            </p>


            <!-- Signup Button -->
            <button
                type="submit"
                class="signup-button">

                Sign Up

            </button>


            <!-- Login Link -->
            <div class="signup-login">

                <a href="index.html">
                    Already have an account?
                </a>

            </div>


        </form>

    </div>


    <!-- JavaScript -->
    <script src="js/signup.js"></script>

</body>

</html>
